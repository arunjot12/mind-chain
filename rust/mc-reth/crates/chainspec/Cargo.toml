[package]
name = "reth-mind-chain-chainspec"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"
description = "EVM chain spec implementation for optimism."

[lints]
workspace = true

[dependencies]
# reth
reth-chainspec.workspace = true
reth-ethereum-forks.workspace = true
reth-primitives-traits.workspace = true
reth-network-peers.workspace = true

# mc-reth
reth-mind-chain-forks.workspace = true
reth-mind-chain-primitives = { workspace = true, features = ["serde"] }

# ethereum
alloy-chains.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-hardforks.workspace = true

# op
op-alloy-rpc-types.workspace = true

serde_json.workspace = true

# misc
derive_more.workspace = true
op-alloy-consensus.workspace = true

[dev-dependencies]
reth-chainspec = { workspace = true, features = ["test-utils"] }
alloy-op-hardforks.workspace = true

[features]
default = ["std", "reth-codec"]
# Enables `reth-mind-chain-primitives`' reth-codec (Compact DB codec / zstd compression).
# On by default to preserve existing behavior; type-only consumers (e.g. zkVM targets) can
# set `default-features = false` to avoid the native `zstd-sys` C build, which this crate
# does not need (it has no Compact/zstd usage of its own).
reth-codec = ["reth-mind-chain-primitives/reth-codec"]
std = [
    "alloy-chains/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "alloy-eips/std",
    "op-alloy-rpc-types/std",
    "reth-chainspec/std",
    "reth-ethereum-forks/std",
    "reth-primitives-traits/std",
    "reth-mind-chain-forks/std",
    "reth-mind-chain-primitives/std",
    "alloy-consensus/std",
    "derive_more/std",
    "reth-network-peers/std",
    "serde_json/std",
    "op-alloy-consensus/std",
]
serde = [
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-hardforks/serde",
    "alloy-primitives/serde",
    "op-alloy-rpc-types/serde",
    "reth-ethereum-forks/serde",
    "reth-mind-chain-forks/serde",
    "reth-mind-chain-primitives/serde",
    "reth-primitives-traits/serde",
    "op-alloy-consensus/serde",
    "alloy-op-hardforks/serde",
]
