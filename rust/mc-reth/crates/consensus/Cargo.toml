[package]
name = "reth-mind-chain-consensus"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"
exclude = [".github/"]

[lints]
workspace = true

[dependencies]
# reth
reth-execution-types.workspace = true
reth-chainspec.workspace = true
reth-consensus-common.workspace = true
reth-consensus.workspace = true
reth-ethereum-consensus.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true
reth-storage-errors.workspace = true
reth-trie-common.workspace = true

# mc-reth
reth-mind-chain-forks.workspace = true
reth-mind-chain-primitives.workspace = true

# op-alloy
op-alloy-consensus.workspace = true

# metrics
reth-metrics = { workspace = true, optional = true }

# ethereum
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-trie.workspace = true
revm.workspace = true

# misc
tracing.workspace = true
thiserror.workspace = true
reth-mind-chain-chainspec.workspace = true

[dev-dependencies]
reth-mind-chain-chainspec.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
reth-chain-state = { workspace = true, features = ["test-utils"] }
reth-stages-types.workspace = true
reth-storage-overlay.workspace = true
reth-db-common.workspace = true
reth-revm.workspace = true
reth-trie.workspace = true
reth-mind-chain-node.workspace = true

alloy-chains.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
rstest.workspace = true

[features]
default = ["std"]
std = [
    "dep:reth-metrics",
    "reth-chainspec/std",
    "reth-consensus/std",
    "reth-consensus-common/std",
    "reth-ethereum-consensus/std",
    "reth-primitives-traits/std",
    "reth-mind-chain-forks/std",
    "reth-mind-chain-chainspec/std",
    "reth-mind-chain-primitives/std",
    "reth-storage-api/std",
    "reth-storage-errors/std",
    "reth-trie-common/std",
    "alloy-chains/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-consensus/std",
    "alloy-trie/std",
    "reth-revm/std",
    "revm/std",
    "tracing/std",
    "thiserror/std",
    "reth-execution-types/std",
    "op-alloy-consensus/std",
]
