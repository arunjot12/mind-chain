[package]
name = "reth-op"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"

[lints]
workspace = true

[dependencies]
# reth
reth-primitives-traits.workspace = true
reth-chainspec.workspace = true
reth-network = { workspace = true, optional = true }
reth-network-api = { workspace = true, optional = true }
reth-eth-wire = { workspace = true, optional = true }
reth-provider = { workspace = true, optional = true }
reth-db = { workspace = true, optional = true, features = ["mdbx"] }
reth-codecs = { workspace = true, optional = true }
reth-storage-api = { workspace = true, optional = true }
reth-node-api = { workspace = true, optional = true }
reth-node-core = { workspace = true, optional = true }
reth-consensus = { workspace = true, optional = true }
reth-consensus-common = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
reth-revm = { workspace = true, optional = true }
reth-rpc = { workspace = true, optional = true }
reth-rpc-api = { workspace = true, optional = true }
reth-rpc-eth-types = { workspace = true, optional = true }
reth-rpc-builder = { workspace = true, optional = true }
reth-exex = { workspace = true, optional = true }
reth-transaction-pool = { workspace = true, optional = true }
reth-trie = { workspace = true, optional = true }
reth-trie-db = { workspace = true, optional = true }
reth-node-builder = { workspace = true, optional = true }
reth-tasks = { workspace = true, optional = true }
reth-cli-util = { workspace = true, optional = true }
reth-engine-local = { workspace = true, optional = true }

# reth-op
alloy-primitives.workspace = true
reth-mind-chain-primitives.workspace = true
reth-mind-chain-chainspec.workspace = true
reth-mind-chain-consensus = { workspace = true, optional = true }
reth-mind-chain-evm = { workspace = true, optional = true }
reth-mind-chain-node = { workspace = true, optional = true }
reth-mind-chain-rpc = { workspace = true, optional = true }
reth-mind-chain-cli = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
	"reth-chainspec/std",
	"reth-consensus?/std",
	"reth-consensus-common?/std",
	"reth-mind-chain-chainspec/std",
	"reth-mind-chain-consensus?/std",
	"reth-mind-chain-evm?/std",
	"reth-mind-chain-primitives/std",
	"reth-primitives-traits/std",
	"reth-storage-api?/std",
	"reth-evm?/std",
	"reth-revm?/std",
	"alloy-primitives/std",
	"reth-codecs?/std",
]
arbitrary = [
	"std",
	"reth-chainspec/arbitrary",
	"reth-mind-chain-primitives/arbitrary",
	"reth-primitives-traits/arbitrary",
	"reth-db?/arbitrary",
	"reth-transaction-pool?/arbitrary",
	"reth-eth-wire?/arbitrary",
	"reth-codecs?/arbitrary",
	"alloy-primitives/arbitrary"
]
keccak-cache-global = [
	"reth-mind-chain-node?/keccak-cache-global",
	"reth-node-core?/keccak-cache-global",
	"reth-mind-chain-cli?/keccak-cache-global",
	"alloy-primitives/keccak-cache-global"
]
test-utils = [
	"reth-chainspec/test-utils",
	"reth-consensus?/test-utils",
	"reth-db?/test-utils",
	"reth-evm?/test-utils",
	"reth-revm?/test-utils",
	"reth-network?/test-utils",
	"reth-mind-chain-node?/test-utils",
	"reth-primitives-traits/test-utils",
	"reth-provider?/test-utils",
	"reth-trie?/test-utils",
	"reth-transaction-pool?/test-utils",
	"reth-node-builder?/test-utils",
	"reth-trie-db?/test-utils",
	"reth-codecs?/test-utils",
	"reth-tasks?/test-utils"
]

full = ["consensus", "evm", "node", "provider", "rpc", "trie", "pool", "network"]

alloy-compat = ["reth-mind-chain-primitives/alloy-compat"]
cli = ["dep:reth-mind-chain-cli", "dep:reth-cli-util"]
consensus = [
    "dep:reth-consensus",
    "dep:reth-consensus-common",
    "dep:reth-mind-chain-consensus",
]
evm = ["dep:reth-evm", "dep:reth-mind-chain-evm", "dep:reth-revm"]
exex = ["provider", "dep:reth-exex"]
node-api = ["dep:reth-node-api", "dep:reth-node-core", "dep:reth-codecs", "reth-mind-chain-primitives/reth-codec"]
node = [
    "provider",
    "consensus",
    "evm",
    "network",
    "node-api",
    "dep:reth-mind-chain-node",
    "dep:reth-node-builder",
    "dep:reth-engine-local",
    "rpc",
    "trie-db",
    "pool",
]
rpc = [
    "tasks",
    "dep:reth-rpc",
    "dep:reth-rpc-builder",
    "dep:reth-rpc-api",
    "dep:reth-rpc-eth-types",
    "dep:reth-mind-chain-rpc",
]
tasks = ["dep:reth-tasks"]
jemalloc = [
    "reth-cli-util?/jemalloc",
    "reth-node-core?/jemalloc",
    "reth-mind-chain-cli?/jemalloc",
    "reth-provider?/jemalloc",
]
js-tracer = [
    "rpc",
    "reth-rpc/js-tracer",
    "reth-node-builder?/js-tracer",
    "reth-mind-chain-node?/js-tracer",
    "reth-rpc-eth-types?/js-tracer",
]
network = ["dep:reth-network", "tasks", "dep:reth-network-api", "dep:reth-eth-wire"]
otlp = [
    "reth-node-core?/otlp",
    "reth-mind-chain-cli?/otlp",
]
portable = [
    "reth-mind-chain-evm?/portable",
    "reth-revm?/portable",
]
provider = ["storage-api", "tasks", "dep:reth-provider", "dep:reth-db", "dep:reth-codecs", "reth-mind-chain-primitives/reth-codec"]
pool = ["dep:reth-transaction-pool"]
storage-api = ["dep:reth-storage-api"]
trie = ["dep:reth-trie", "alloy-primitives/rayon"]
trie-db = ["trie", "dep:reth-trie-db", "dep:reth-codecs", "reth-mind-chain-primitives/reth-codec"]
