name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [mc-node, mc-batcher, mc-proposer, mc-challenger, mc-reth, kona-host]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main / tags)
        run: |
          set -euo pipefail
          export REGISTRY=ghcr.io
          export REPOSITORY="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mind-chain"
          export PLATFORMS=linux/amd64
          export GIT_COMMIT="$GITHUB_SHA"
          export GIT_DATE="$(git show -s --format=%ct)"
          export IMAGE_TAGS="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export GIT_VERSION="$GITHUB_REF_NAME"
            export IMAGE_TAGS="$IMAGE_TAGS,$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = main ]; then
            export IMAGE_TAGS="$IMAGE_TAGS,main"
          fi
          out=""; [ "${{ github.event_name }}" != pull_request ] && out="--push"
          docker buildx bake -f docker-bake.hcl --progress plain $out ${{ matrix.target }}
