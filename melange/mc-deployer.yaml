package:
  name: mc-deployer
  version: "0.0.0"
  epoch: 0
  description: mc-deployer — OP Stack deployment tool
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - bash
      - curl
      - go-1.26
      - git
      - jq
      - yq
      - zip
  environment:
    CGO_ENABLED: "0"

pipeline:

  - uses: mc-deployer/install-forge

  # Compile contracts-bedrock and pack the artifacts mc-deployer embeds via
  # //go:embed — must exist before `go build`, or `mc-deployer apply` fails at
  # runtime with "artifacts.tzst: file does not exist".
  - uses: mc-deployer/embed-artifacts

  - uses: go/build
    with:
      modroot: .
      packages: ./mc-deployer/cmd/mc-deployer
      output: mc-deployer
      go-package: go-1.26
      # /usr/local/bin, where upstream's images install binaries.
      prefix: usr/local
      ldflags: -s -w -X github.com/mindchain/mind-chain/mc-deployer/pkg/deployer/version.GitCommit=${GIT_COMMIT:-unknown} -X github.com/mindchain/mind-chain/mc-deployer/pkg/deployer/version.GitDate=${GIT_DATE:-0} -X github.com/mindchain/mind-chain/mc-deployer/pkg/deployer/version.Version=${GIT_VERSION:-v0.0.0} -X github.com/mindchain/mind-chain/mc-deployer/pkg/deployer/version.Meta=$(if [ -n "${GIT_VERSION}" ]; then printf ""; else printf "dev"; fi)

  - uses: strip
