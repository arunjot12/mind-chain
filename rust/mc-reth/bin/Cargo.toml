[package]
name = "mc-reth"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
reth-cli-util.workspace = true
reth-mind-chain-cli.workspace = true
reth-mind-chain-rpc.workspace = true
reth-mind-chain-node.workspace = true
reth-mind-chain-chainspec.workspace = true
reth-mind-chain-consensus.workspace = true
reth-mind-chain-evm.workspace = true
reth-mind-chain-payload-builder.workspace = true
reth-mind-chain-primitives.workspace = true
reth-mind-chain-forks.workspace = true
reth-node-builder.workspace = true
reth-node-core.workspace = true
reth-db.workspace = true

op-version.workspace = true

tracing.workspace = true
eyre.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[features]
default = ["jemalloc", "otlp", "reth-mind-chain-evm/portable", "js-tracer", "keccak-cache-global", "asm-keccak"]

otlp = [
    "reth-mind-chain-cli/otlp",
    "reth-node-core/otlp",
]

js-tracer = [
    "reth-mind-chain-node/js-tracer",
    "reth-node-builder/js-tracer",
]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-mind-chain-cli/jemalloc",
    "reth-node-core/jemalloc",
]
jemalloc-prof = ["jemalloc", "reth-cli-util/jemalloc-prof", "reth-mind-chain-cli/jemalloc-prof"]
jemalloc-symbols = ["jemalloc-prof", "reth-mind-chain-cli/jemalloc-symbols"]
tracy-allocator = ["reth-cli-util/tracy-allocator", "tracy"]
tracy = [
    "reth-mind-chain-cli/tracy",
    "reth-node-core/tracy",
]

asm-keccak = [
    "reth-mind-chain-cli/asm-keccak",
    "reth-mind-chain-node/asm-keccak",
    "reth-node-core/asm-keccak",
]
keccak-cache-global = [
    "reth-mind-chain-cli/keccak-cache-global",
    "reth-mind-chain-node/keccak-cache-global",
    "reth-node-core/keccak-cache-global",
]
dev = [
    "reth-mind-chain-cli/dev",
    "reth-mind-chain-primitives/arbitrary",
]

min-error-logs = [
    "tracing/release_max_level_error",
    "reth-node-core/min-error-logs",
]
min-warn-logs = [
    "tracing/release_max_level_warn",
    "reth-node-core/min-warn-logs",
]
min-info-logs = [
    "tracing/release_max_level_info",
    "reth-node-core/min-info-logs",
]
min-debug-logs = [
    "tracing/release_max_level_debug",
    "reth-node-core/min-debug-logs",
]
min-trace-logs = [
    "tracing/release_max_level_trace",
    "reth-node-core/min-trace-logs",
]


[[bin]]
name = "mc-reth"
path = "src/main.rs"
