{{- $context := or . (dict)}}
{{- $el_type := dig "el_type" "op-geth" $context -}}
---
el:
  type: {{ $el_type }}
  image: {{ dig "overrides" "images" $el_type "!!str" $context }}
  log_level: ""
  extra_env_vars: {}
  extra_labels: {}
  extra_params: []
  tolerations: []
  volume_size: 0
  min_cpu: 0
  max_cpu: 0
  min_mem: 0
  max_mem: 0
cl:
  type: mc-node
  image: {{ dig "overrides" "images" "mc-node" (localDockerImage "mc-node") $context }}
  log_level: ""
  extra_env_vars: {}
  extra_labels: {}
  extra_params: []
  tolerations: []
  volume_size: 0
  min_cpu: 0
  max_cpu: 0
  min_mem: 0
  max_mem: 0
mev_params:
  image: ""
  builder_host: ""
  builder_port: ""