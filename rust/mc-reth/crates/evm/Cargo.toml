[package]
name = "reth-mind-chain-evm"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"

[lints]
workspace = true

[dependencies]
# Reth
reth-chainspec.workspace = true
reth-evm.workspace = true
reth-primitives-traits.workspace = true
reth-execution-errors.workspace = true
reth-execution-types.workspace = true
reth-storage-errors.workspace = true

reth-rpc-eth-api = { workspace = true, optional = true }

# ethereum
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-op-evm.workspace = true
op-alloy-consensus.workspace = true
op-alloy-rpc-types = { workspace = true, optional = true }
alloy-rpc-types-eth = { workspace = true, optional = true }
op-alloy-rpc-types-engine.workspace = true
alloy-consensus.workspace = true

# Optimism
reth-mind-chain-chainspec.workspace = true
reth-mind-chain-consensus.workspace = true
reth-mind-chain-forks.workspace = true
reth-mind-chain-primitives.workspace = true

# revm
revm.workspace = true
op-revm.workspace = true

# metrics
reth-metrics = { workspace = true, optional = true }

# misc
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
reth-evm = { workspace = true, features = ["test-utils"] }
reth-revm = { workspace = true, features = ["test-utils"] }
alloy-genesis.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
rstest.workspace = true
serde_json.workspace = true
reth-mind-chain-primitives = { workspace = true, features = ["arbitrary"] }
reth-mind-chain-chainspec.workspace = true

[features]
default = ["std"]
std = [
	"dep:reth-metrics",
	"reth-revm/std",
	"alloy-consensus/std",
	"alloy-eips/std",
	"alloy-genesis/std",
	"alloy-primitives/std",
	"reth-primitives-traits/std",
	"revm/std",
	"reth-mind-chain-primitives/std",
	"reth-mind-chain-forks/std",
	"thiserror/std",
	"tracing/std",
	"op-alloy-consensus/std",
	"reth-chainspec/std",
	"reth-mind-chain-consensus/std",
	"reth-mind-chain-chainspec/std",
	"reth-execution-errors/std",
	"reth-execution-types/std",
	"alloy-evm/std",
	"alloy-op-evm/std",
	"alloy-op-evm/engine",
	"alloy-op-evm/metrics",
	"op-revm/std",
	"reth-evm/std",
	"op-alloy-rpc-types-engine/std",
	"reth-storage-errors/std",
	"op-alloy-rpc-types?/std",
	"alloy-rpc-types-eth?/std"
]
portable = [
    "reth-revm/portable",
    "op-revm/portable",
    "revm/portable",
]
rpc = ["reth-rpc-eth-api", "reth-mind-chain-primitives/serde", "reth-mind-chain-primitives/reth-codec", "alloy-evm/rpc", "alloy-op-evm/rpc", "op-alloy-rpc-types", "alloy-rpc-types-eth"]
