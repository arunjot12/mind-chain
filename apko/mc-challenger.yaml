# Multi-binary image: bundles mc-challenger + multicannon + kona-host.
# needs-melange-apks: op-stack-go, multicannon, op-stack-rust.
# Mirrors monorepo mc-challenger-target: multiplexer only (no loose embed files).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle>=20260909-r3
    - busybox
    - apk-tools
    # ca-certificates provides update-ca-certificates binary (ca-certificates-bundle is cert data only).
    # Required: the chart's /init/entrypoint.sh calls update-ca-certificates before exec.
    - ca-certificates
    - wolfi-baselayout
    # busybox provides /bin/sh — the k8s chart launches mc-challenger via
    # command: ["/bin/sh", "/init/entrypoint.sh"], which fails on a shell-less image.
    - busybox
    - glibc
    - libgcc
    - libstdc++
    - openssl
    - mc-challenger@local
    - multicannon@local
    - kona-host@local

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  # Matches the monorepo mc-challenger-target env. OP_CHALLENGER_CANNON_SERVER
  # (op-program) is gone; the cannon-kona and asterisc-kona servers are kona-host.
  OP_CHALLENGER_CANNON_BIN: /usr/local/bin/cannon
  OP_CHALLENGER_ASTERISC_KONA_SERVER: /usr/local/bin/kona-host
  OP_CHALLENGER_CANNON_KONA_SERVER: /usr/local/bin/kona-host

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  # Run as root to match the monorepo mc-challenger-target (ubuntu base, no USER
  # directive). Also required for the chart's root-owned mc-challenger-data PVC
  # (no fsGroup) — nonroot 65532 would be permission-denied.
  run-as: 0

# No entrypoint, bare-name cmd: matches the upstream image contract
# (CMD ["mc-challenger"], resolved via PATH).
cmd: mc-challenger

annotations:
  org.opencontainers.image.source: https://github.com/arunjot12/mind-chain
  org.opencontainers.image.title: mc-challenger
