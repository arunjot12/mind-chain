# Consolidated build for every Go service of the mind-chain monorepo. One
# melange run, one source checkout, one shared GOMODCACHE/GOCACHE: the module
# dependency graph compiles once and every later subpackage build is
# incremental, instead of 13 independent CI legs each recompiling it from
# scratch.
#
# Each subpackage emits its own APK under the same name the per-service
# configs used (mc-node, mc-batcher, ...), so the apko/*.yaml image configs
# keep pulling e.g. `mc-node@local` unchanged. The op-stack-go package itself
# is an empty meta package.
#
# mc-deployer is NOT here: it needs a submodule checkout and package-local
# Forge install to embed contract artifacts (see melange/mc-deployer.yaml).
package:
  name: op-stack-go
  version: "0.0.0"
  epoch: 0
  description: op-stack-go — meta package for the mind-chain monorepo Go services
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - build-base
      - ca-certificates-bundle
      - bash
      - git
      - go-1.26
      - jq
      - yq
      - zip
  environment:
    CGO_ENABLED: "0"

# mc-core/superchain embed prep runs once before any subpackage go/build.
pipeline:

subpackages:
  - name: mc-node
    description: mc-node — OP Stack rollup node
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./mc-node/cmd
          output: mc-node
          go-package: go-1.26
          # /usr/local/bin, where upstream's images install binaries.
          prefix: usr/local
          ldflags: -s -w -X main.GitCommit=${GIT_COMMIT:-unknown} -X main.GitDate=${GIT_DATE:-0} -X github.com/mindchain/mind-chain/mc-node/version.Version=${GIT_VERSION:-v0.0.0} -X github.com/mindchain/mind-chain/mc-node/version.Meta=$(if [ -n "${GIT_VERSION}" ]; then printf ""; else printf "dev"; fi)
      - uses: strip

  - name: mc-batcher
