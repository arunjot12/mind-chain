[package]
name = "reth-mind-chain-exex"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"
description = "Execution extensions for OP-Reth"

[lints]
workspace = true

[dependencies]
# reth
reth-exex.workspace = true
reth-execution-types.workspace = true
reth-node-api.workspace = true
reth-trie.workspace = true
reth-provider.workspace = true

# mc-reth
# proofs exex handles `TrieUpdates` in notifications
reth-mind-chain-trie = { workspace = true, features = ["serde-bincode-compat"] }

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true

# misc
eyre.workspace = true
futures-util.workspace = true
tracing.workspace = true

[dev-dependencies]
futures.workspace = true
reth-db = { workspace = true, features = ["test-utils"] }
reth-mind-chain-trie = { workspace = true, features = ["test-utils"] }
reth-node-builder.workspace = true
tokio.workspace = true
reth-mind-chain-node.workspace = true
reth-mind-chain-chainspec.workspace = true
reth-primitives-traits.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm-ethereum.workspace = true
reth-exex-test-utils.workspace = true
tempfile.workspace = true

[features]
test-utils = [
	"reth-db/test-utils",
	"reth-trie/test-utils",
	"reth-node-builder/test-utils",
	"reth-mind-chain-node/test-utils",
	"reth-provider/test-utils",
	"reth-ethereum-primitives/test-utils",
	"reth-primitives-traits/test-utils",
	"reth-mind-chain-trie/test-utils"
]
metrics = [
	"reth-mind-chain-trie/metrics",
	"reth-trie/metrics"
]

[package.metadata.cargo-udeps.ignore]
development = [
    "reth-node-builder",
    "reth-mind-chain-node",
    "reth-mind-chain-chainspec",
    "tempfile.workspace",
]
